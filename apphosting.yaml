# Firebase App Hosting configuration (backend: bumex-dashboard, europe-west4).
# Secrets live in Cloud Secret Manager; set them with
#   firebase apphosting:secrets:set <NAME> --data-file <file>

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: FIREBASE_PROJECT_ID
    value: bumex-one
  - variable: FIREBASE_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@bumex-one.iam.gserviceaccount.com
  - variable: FIREBASE_STORAGE_BUCKET
    value: bumex-one.firebasestorage.app
  - variable: FIREBASE_DATABASE_ID
    value: bumex
  - variable: FIREBASE_PRIVATE_KEY
    secret: firebase-private-key
    availability:
      - RUNTIME
  - variable: FIREBASE_API_KEY
    secret: firebase-api-key
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_ENABLE_SELF_SIGNUP
    value: "0"
    availability:
      - BUILD
      - RUNTIME
  - variable: ENABLE_SELF_SIGNUP
    value: "0"
  - variable: ENABLE_ENTITY_SCOPING
    value: "0"
  - variable: ENABLE_LOCAL_PREVIEW_AUTH
    value: "0"

  # Links in notification emails and invoices (lib/app-url.ts). one.bumex.mr is this
  # backend's domain; dashboard.bumex.mr still serves the older Vercel app.
  - variable: APP_URL
    value: https://one.bumex.mr
  - variable: NOTIFICATION_EMAIL_FROM
    value: "BUMEX Dashboard <notifications@verify.bumex.mr>"
  # Create it before deploying, or the rollout fails:
  #   firebase apphosting:secrets:set resend-api-key --project bumex-one
  - variable: RESEND_API_KEY
    secret: resend-api-key
    availability:
      - RUNTIME

  # ERP database (lib/erp/db.ts, db/erp/README.md): Cloud SQL for PostgreSQL in this project. The backend's service
  # account has Cloud SQL Client; the bumex_app password is the secret erp-database-password.
  - variable: ERP_CLOUDSQL_INSTANCE
    value: bumex-one:europe-west4:bumex-erp-vanguard
    availability:
      - RUNTIME
  - variable: ERP_DATABASE_NAME
    value: bumex_erp
    availability:
      - RUNTIME
  - variable: ERP_DATABASE_USER
    value: bumex_app
    availability:
      - RUNTIME
  - variable: ERP_DATABASE_PASSWORD
    secret: erp-database-password
    availability:
      - RUNTIME
