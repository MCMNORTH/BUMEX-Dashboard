# Firebase App Hosting configuration (backend: bumex-dashboard, europe-west4).
# Secrets live in Cloud Secret Manager; set them with
#   firebase apphosting:secrets:set <NAME> --data-file <file>

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: FIREBASE_PROJECT_ID
    value: bumex-one
  - variable: FIREBASE_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@bumex-one.iam.gserviceaccount.com
  - variable: FIREBASE_STORAGE_BUCKET
    value: bumex-one.firebasestorage.app
  - variable: FIREBASE_DATABASE_ID
    value: bumex
  - variable: FIREBASE_PRIVATE_KEY
    secret: firebase-private-key
    availability:
      - RUNTIME
  - variable: FIREBASE_API_KEY
    secret: firebase-api-key
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_ENABLE_SELF_SIGNUP
    value: "0"
    availability:
      - BUILD
      - RUNTIME
  - variable: ENABLE_SELF_SIGNUP
    value: "0"
  - variable: ENABLE_ENTITY_SCOPING
    value: "0"
  - variable: ENABLE_LOCAL_PREVIEW_AUTH
    value: "0"

  # Notification emails (lib/notifications/email-delivery.ts). dashboard.bumex.mr
  # still serves the older Vercel app, so links point at this backend.
  - variable: APP_URL
    value: https://bumex-dashboard--bumex-one.europe-west4.hosted.app
  - variable: NOTIFICATION_EMAIL_FROM
    value: "BUMEX Dashboard <notifications@verify.bumex.mr>"
  # Create it before deploying, or the rollout fails:
  #   firebase apphosting:secrets:set resend-api-key --project bumex-one
  - variable: RESEND_API_KEY
    secret: resend-api-key
    availability:
      - RUNTIME
